[package]
name = "tracing-opentelemetry-setup"
version = "0.8.5"
edition = "2024"
rust-version = "1.85"
description = "Utilities to provide proper setup of tracing with OTEL export"
readme = "README.md"
repository = "https://github.com/DoumanAsh/tracing-opentelemetry-setup"
license = "BSL-1.0"
keywords = ["tracing", "opentelemetry"]
include = [
    "**/*.rs",
    "Cargo.toml",
    "README.md"
]

[dependencies.tracing]
version = "0.1"
default-features = false

[dependencies.tracing-subscriber]
version = "0.3.22"
default-features = false

[dependencies.tracing-opentelemetry]
version = "0.33"
default-features = false

[dependencies.opentelemetry-appender-tracing]
version = "0.32"
default-features = false

[dependencies.opentelemetry]
version = "0.32"
default-features = false

[dependencies.opentelemetry_sdk]
version = "0.32"
default-features = false
features = ["logs", "trace"]

[dependencies.opentelemetry-otlp]
version = "0.32"
default-features = false
features = ["logs", "trace"]

[dependencies.tonic]
version = "0.14"
default-features = false
optional = true

[dependencies.metrics-opentelemetry]
version = "0.24032.5"
optional = true

[dependencies.http]
version = "1"
default-features = false
optional = true

[dependencies.opentelemetry-http]
version = "0.32"
default-features = false
optional = true

# ureq http client support
[dependencies.ureq]
version = "3"
default-features = false
optional = true

# Datadog related deps
[dependencies.serde]
version = "1"
default-features = false
optional = true

[dependencies.opentelemetry-datadog]
version = "0.20"
default-features = false
optional = true
# Only blocking client works with batch processor
features = ["intern-ahash", "reqwest-blocking-client"]

[dependencies.time]
version = "0.3"
default-features = false
optional = true
features = ["formatting"]

[dependencies.serde_json]
version = "1"
default-features = false
features = ["std"]
optional = true

[dependencies.tokio]
version = "1.22"
optional = true
default-features = false

# propagation-aws
[dependencies.str-buf]
version = "4"
default-features = false
optional = true

[features]
# Enables panic hook
panic = []
# Enables propagation utilities
propagation = []
# Enables propagation utilities with support for AWS XRay
propagation-aws = ["propagation", "dep:str-buf"]
# Enables metrics propagation via metrics crate
metrics = ["opentelemetry_sdk/metrics", "opentelemetry-otlp/metrics", "metrics-opentelemetry"]
# Enables metrics propagation via tracing-opentelemetry crate
tracing-metrics = ["opentelemetry_sdk/metrics", "opentelemetry-otlp/metrics", "tracing-opentelemetry/metrics"]
# Specifies you want to use tokio runtime
rt-tokio = [
    "tokio/rt",
    "opentelemetry_sdk/rt-tokio",
    "opentelemetry_sdk/rt-tokio-current-thread",
    "opentelemetry_sdk/experimental_logs_batch_log_processor_with_async_runtime",
    "opentelemetry_sdk/experimental_trace_batch_span_processor_with_async_runtime",
    "opentelemetry_sdk/experimental_metrics_periodicreader_with_async_runtime",
]

# Propagates `tracing-log` feature
tracing-log = ["tracing-opentelemetry/tracing-log", "tracing-subscriber/tracing-log"]

# non-standard exporters
datadog = ["serde", "time", "serde_json", "opentelemetry-datadog"]

# gRPC transport features
grpc = ["opentelemetry-otlp/grpc-tonic", "tonic"]
grpc-compression = ["grpc", "opentelemetry-otlp/gzip-tonic"]
grpc-tls = ["grpc", "opentelemetry-otlp/tls-roots"]
grpc-retry = ["grpc", "rt-tokio", "opentelemetry-otlp/experimental-grpc-retry"]

# HTTP transport features
http = ["opentelemetry-otlp/http-proto", "opentelemetry-otlp/http-json", "dep:http"]
http-compression = ["http", "opentelemetry-otlp/gzip-http"]
http-tls = ["http", "opentelemetry-otlp/reqwest-rustls"]
http-retry = ["http", "rt-tokio", "opentelemetry-otlp/experimental-http-retry"]

# HTTP client selection
http-reqwest-blocking = ["http", "opentelemetry-otlp/reqwest-blocking-client"]
http-reqwest = ["http", "opentelemetry-otlp/reqwest-client"]
http-hyper = ["http", "opentelemetry-otlp/hyper-client"]
http-ureq = ["http", "ureq", "opentelemetry-http"]
http-ureq-tls = ["http-ureq", "ureq/rustls", "ureq/platform-verifier"]

# Enable internal logs within opentelemetry
internal-logs = ["opentelemetry/internal-logs", "opentelemetry_sdk/internal-logs", "opentelemetry-otlp/internal-logs"]

# Enable experimental metrics feature to improve performance
experimental_otel_metrics = ["metrics-opentelemetry/experimental_metrics_bound_instruments"]

[package.metadata.docs.rs]
features = ["metrics", "grpc", "http", "propagation-aws", "panic", "datadog", "http-ureq", "tracing-metrics"]
